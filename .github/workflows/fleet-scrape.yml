name: Fleet Scrape

on:
  schedule:
    # 3x daily — same cadence the previous kris-ow/robo-tracker workflow used.
    # 03:00 / 11:00 / 19:00 UTC = 04 / 12 / 20 CET (winter), 05 / 13 / 21 CEST (summer).
    - cron: '0 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The robotaxi tile this feeds is hidden; the merger-odds card below is
      # visible. A tracker outage must not skip the steps after it — that's how
      # a 2026-08-10 selector drift froze the merger-odds card for 3 days. The
      # run is still marked failed at the end so the breakage stays visible.
      - name: Scrape tracker (operational + unsupervised)
        id: scrape
        run: node scripts/scrape-tracker.js
        continue-on-error: true

      # Polymarket outage shouldn't block tracker updates; card flags stale data after 24h.
      - name: Fetch merger odds
        run: node scripts/fetch-merger-odds.js
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "TTT Pipeline Bot"
          git config user.email "pipeline@theteslathesis.com"
          git add src/data/knowledge-base.json data/counts.json data/merger-odds.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No tracker changes to commit"
          else
            git commit -m "Fleet scrape: $(date -u +%Y-%m-%dT%H:%MZ)

          Updated robotaxitracker.com counts and/or Polymarket merger odds"
            git pull --rebase
            git push
          fi

      # Last, so a broken scraper still surfaces as a red run after the
      # merger-odds fetch and commit have had their chance to run.
      - name: Fail if tracker scrape failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Tracker scrape failed (see the scrape step). Merger odds and commit still ran."
          exit 1
