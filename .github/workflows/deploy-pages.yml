name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Skip Mac Mini churn that never changes the built site: hourly heartbeat
    # commits, pipeline state, and raw transcript pushes. The feed renders from
    # src/data/news.json (committed + self-deployed by daily-pipeline.yml), and
    # the robotaxi/merger tiles fetch data/*.json from raw.githubusercontent.com
    # at runtime — none of these paths need a Pages deploy. Manual summary fixes
    # still deploy because they land together with a regenerated news.json.
    paths-ignore:
      - 'scripts/pipeline/heartbeat.json'
      - 'scripts/pipeline/state.json'
      - 'scripts/pipeline/costs.json'
      - 'news/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the repo-wide "pages" concurrency group with daily-pipeline.yml's deploy
# job so the two never call the Pages deployment API at once (that race caused
# repeated "due to in progress deployment" 400s). cancel-in-progress: false lets
# an in-flight production deploy finish; GitHub auto-collapses intermediate queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
