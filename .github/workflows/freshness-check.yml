name: Content Freshness Check

on:
  schedule:
    # Run at 12:00 UTC daily — after all 3 pipeline runs should have completed
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for stale content
        id: check
        run: |
          alerts=""

          # ── Check unsummarized transcripts ──
          stale_files=""
          stale_count=0
          for f in news/*.txt; do
            base="${f%.txt}"
            # *_reddit_bullets.txt is a weekly-brief sidecar for reddit-weekly.js, not a
            # transcript — it is never summarized by design (build-news.js ignores it too).
            # Without this it reported one phantom gap per week from 2026-07-06 onward.
            if [[ "$f" == *_reddit_bullets.txt ]]; then continue; fi
            # Retired channels are deliberately never summarized (RETIRED_CHANNELS in
            # scripts/pipeline/config.js — KEEP THIS LIST IN SYNC). Without the skip they
            # would be reported as permanent gaps, the same phantom-gap bug as above.
            case "$(basename "$f")" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_munrolive_*) continue ;;
            esac
            if [[ "$f" != *_summary.txt ]] && [[ ! -f "${base}_summary.txt" ]]; then
              stale_files="$stale_files\n- \`$(basename $f)\`"
              stale_count=$((stale_count + 1))
            fi
          done

          if [ $stale_count -gt 0 ]; then
            alerts="$alerts\n### Unsummarized transcripts: $stale_count\n$stale_files"
            echo "Found $stale_count unsummarized transcript(s)"
          fi

          # Write alerts to file for the next step
          echo -e "$alerts" > /tmp/alerts.txt

          if [ -n "$alerts" ]; then
            echo "has_alerts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_alerts=false" >> "$GITHUB_OUTPUT"
            echo "All checks passed"
          fi

      # One rolling issue, rewritten in place — the previous version commented on the
      # open issue each day, and comments send notification mail (changed 2026-08-10).
      - name: Update freshness issue
        if: steps.check.outputs.has_alerts == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { upsertRollingIssue, rollingFooter } = require(`${process.env.GITHUB_WORKSPACE}/scripts/rolling-issue.cjs`);
            const alerts = fs.readFileSync('/tmp/alerts.txt', 'utf-8').trim();

            const res = await upsertRollingIssue(github, context, {
              label: 'content-gap',
              title: 'Content freshness: unsummarized transcripts',
              color: 'D4C5F9',
              body: `The daily freshness check found content gaps:\n\n${alerts}\n\n**Action:** check Mac Mini services and/or trigger the pipeline manually (\`gh workflow run daily-pipeline.yml -f mode=direct\`).${rollingFooter()}`,
            });
            console.log(`${res.created ? 'Created' : 'Updated'} freshness issue #${res.number}`);

      # Gaps cleared: blank the rolling issue's body so a stale list can't mislead.
      # Left open deliberately — closing it would notify, and the next gap reuses it.
      - name: Clear freshness issue when healthy
        if: steps.check.outputs.has_alerts == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const { rollingFooter } = require(`${process.env.GITHUB_WORKSPACE}/scripts/rolling-issue.cjs`);
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'content-gap', per_page: 100 });
            const rolling = open.data.find(i => i.title === 'Content freshness: unsummarized transcripts');
            if (!rolling) { console.log('No freshness issue to clear'); return; }
            await github.rest.issues.update({
              owner, repo, issue_number: rolling.number,
              body: `**All clear** — every transcript has a summary.${rollingFooter()}`,
            });
            console.log(`Cleared freshness issue #${rolling.number}`);
