name: Daily Summary Pipeline

on:
  schedule:
    # 4x daily: Europe 6AM, US East 6AM, US West 6AM, evening catch-up.
    # Acts as a safety net now that push events handle the common case.
    # Split entries so github.event.schedule can distinguish the early runs (which
    # build the exec summary) from the later runs (which skip it).
    - cron: '15 0 * * *'
    - cron: '15 7 * * *'
    - cron: '15 10 * * *'
    - cron: '45 17 * * *'
    # Monday-only early slot dedicated to the weekly brief. Off the :00/:15
    # stampede so it actually fires near schedule, instead of the 3–4h delay
    # the 07:15 slot saw on Mondays 2026-05-11/05-18/05-25.
    # Since 2026-07-06 this is a FALLBACK: the Mac Mini dispatches this workflow
    # (mode=direct, skip_exec=true) at 05:45 UTC Mondays because Actions cron
    # still lagged ~4h; weekly-summary.js skips if the week's brief already exists.
    - cron: '45 5 * * 1'
  push:
    # Fire as soon as Mac Mini pushes new transcripts. Bot's own _summary.txt
    # commits use GITHUB_TOKEN, which does NOT trigger workflows — so no loop.
    # Time-gated steps below (exec/weekly/Reddit briefs) check
    # github.event.schedule, which is undefined on push, so they stay cron-only.
    branches: [master]
    paths:
      - 'news/**.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Processing mode: batch (default, cheap, slow) or direct (2x cost, instant)'
        required: false
        default: 'batch'
        type: choice
        options:
          - batch
          - direct
      skip_exec:
        description: 'Skip the executive summary step (used by the Mac Mini Monday weekly-brief dispatch)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 210 # 3.5 hours max (batch + up to 3 retries at 20min intervals)
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Transcripts are pushed directly to repo by Mac Mini yt-transcripts
      # Step 1: Summarize new transcripts via Claude Batch API
      - name: Count interview leads (before)
        id: leads_before
        run: echo "count=$(node -e "const fs=require('fs');let n=0;try{n=JSON.parse(fs.readFileSync('scripts/pipeline/extracted-facts.json','utf8')).filter(f=>f.type==='interview_mention').length}catch{};console.log(n)")" >> "$GITHUB_OUTPUT"

      - name: Run summary pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_MODE: ${{ inputs.mode || 'batch' }}
        run: node scripts/pipeline/run.js

      # Notify via GitHub issue when this run extracted new interview_mention
      # facts — they sit in the admin console review queue until approved.
      # extracted-facts.json is append-only in CI, so slicing the mentions
      # array at the before-count yields exactly this run's new leads.
      - name: Notify on new interview leads
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          LEADS_BEFORE: ${{ steps.leads_before.outputs.count }}
        with:
          script: |
            const fs = require('fs');
            let facts = [];
            try { facts = JSON.parse(fs.readFileSync('scripts/pipeline/extracted-facts.json', 'utf8')); } catch {}
            const mentions = facts.filter(f => f.type === 'interview_mention');
            const fresh = mentions.slice(Number(process.env.LEADS_BEFORE || 0));
            if (fresh.length === 0) { console.log('No new interview leads'); return; }
            const list = fresh.map(f =>
              `- **${f.person}** @ ${f.venue} (${f.approx_date || 'date unknown'}) — via ${f.channel}, \`${f.source}\`${f.context ? `\n  - ${f.context}` : ''}`
            ).join('\n');
            const persons = [...new Set(fresh.map(f => f.person))].join(', ');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Interview lead${fresh.length > 1 ? 's' : ''} awaiting review: ${persons}`,
              body: `The pipeline extracted ${fresh.length} new interview mention${fresh.length > 1 ? 's' : ''}:\n\n${list}\n\n**Next step:** review in the admin console (\`cd admin && npm run dev\` → REVIEW QUEUE → approve/reject → [PUBLISH]). Approved leads land in \`data/interview-leads.json\` for resolution.\n\nClose this issue once reviewed.`,
              labels: ['interview-lead'],
            });
            console.log(`Created issue for ${fresh.length} new lead(s)`);

      # Keep ONE rolling issue listing every summary currently hidden from the feed
      # and Daily Brief as tangential/off-topic, awaiting review in the admin console
      # (MODERATION tab). Rewritten in place each run, so it never sends notification
      # mail — creating one issue per run was ~2/day and 93% of all repo mail (changed
      # 2026-08-10). It reports the WHOLE standing queue, not just this run's additions,
      # so items decided in the console drop off by themselves. New summaries are still
      # untracked at this point (the commit step runs later) but are already on disk,
      # so scanning news/ sees them.
      - name: Update moderation queue issue
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { upsertRollingIssue, rollingFooter } = require(`${process.env.GITHUB_WORKSPACE}/scripts/rolling-issue.cjs`);

            let moderation = { include: [], exclude: [], exempt_channels: [] };
            try { moderation = { include: [], exclude: [], exempt_channels: [], ...JSON.parse(fs.readFileSync('data/moderation.json', 'utf8')) }; } catch {}

            const pending = [];
            for (const name of fs.readdirSync('news').filter(f => f.endsWith('_summary.txt')).sort().reverse()) {
              if (moderation.include.includes(name) || moderation.exclude.includes(name)) continue;
              if (moderation.exempt_channels.includes((name.match(/^\d{8}_([^_]+)_/) || [])[1])) continue;
              // Strip CR: header lines are LF in CI but CRLF on a Windows checkout,
              // and a trailing \r makes the `(.+)$` capture below fail to match.
              const header = fs.readFileSync(`news/${name}`, 'utf8').replace(/\r\n/g, '\n').split('─'.repeat(5))[0];
              const meta = {};
              for (const line of header.split('\n')) {
                const m = line.match(/^(\w[\w\s]*?):\s+(.+)$/);
                if (m) meta[m[1].trim().toLowerCase()] = m[2].trim();
              }
              if (/^(tangential|off-topic)\b/i.test(meta.relevance || '')) {
                const d = name.slice(0, 8);
                pending.push({
                  name,
                  date: `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`,
                  title: meta.title || name,
                  channel: meta.channel || meta.source || '?',
                  relevance: meta.relevance,
                });
              }
            }

            const review = '**Next step:** review in the admin console (`cd admin && npm run dev` → MODERATION → SHOW IN FEED / KEEP HIDDEN → [PUBLISH]). Decisions land in `data/moderation.json` and reviewed items disappear from this list on the next run.';
            let body;
            if (pending.length === 0) {
              body = `**Queue empty** — no summaries are currently hidden pending review.${rollingFooter()}`;
            } else {
              // Cap the rendering; the issue body limit is 64KB and the count above is the real signal.
              const CAP = 60;
              const shown = pending.slice(0, CAP);
              let list = '';
              let lastDate = null;
              for (const p of shown) {
                if (p.date !== lastDate) { list += `\n### ${p.date}\n`; lastDate = p.date; }
                list += `- **${p.title}** (${p.channel}) — ${p.relevance}\n  - \`${p.name}\`\n`;
              }
              const more = pending.length > CAP ? `\n_…and ${pending.length - CAP} older item(s) not listed._\n` : '';
              body = `**${pending.length} piece${pending.length > 1 ? 's' : ''}** classified tangential/off-topic and hidden from the feed and Daily Brief, awaiting review.\n${list}${more}\n${review}${rollingFooter()}`;
            }

            const res = await upsertRollingIssue(github, context, {
              label: 'moderation',
              title: 'Content moderation queue',
              body,
              color: 'FBCA04',
            });
            console.log(`${res.created ? 'Created' : 'Updated'} moderation queue issue #${res.number} — ${pending.length} pending`);

      # Step 2: Build the Daily Tesla Brief. Since 2026-08-28 this is a pipeline
      # INTERMEDIATE, not reader-facing — build-news.js keeps it out of the feed, but
      # weekly-summary.js builds the Weekly Brief only from these files, so it must
      # keep running daily.
      # 00:15 UTC generates the recap of yesterday. 07:15 UTC used to REGENERATE it to
      # fold in late material; it now only BACKFILLS (--skip-if-exists) when the 00:15
      # run produced nothing. That halves the brief's cost (~$3.53 -> ~$1.75/mo; it was
      # running 53x over 28 days in 2026-08) while keeping the redundancy the weekly
      # depends on — GitHub skipped the 00:15 slot entirely on 2026-08-27, and
      # mis-attributed the delayed 08-28 run so this step never fired. Dropping 07:15
      # outright would have lost two briefs in one week.
      # The 10:15, 17:45, and Monday 05:45 runs skip this step. workflow_dispatch still
      # forces a full regeneration.
      # Gate on github.event.schedule (the cron expression that triggered the run), not wall-clock
      # time — Actions cron is routinely delayed 3+ hours, which silently skipped the gate previously.
      - name: Build executive summary
        continue-on-error: true
        if: (github.event_name == 'workflow_dispatch' && inputs.skip_exec != true) || github.event.schedule == '15 0 * * *' || github.event.schedule == '15 7 * * *'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 7 * * *" ]; then
            node scripts/pipeline/exec-summary.js --skip-if-exists
          else
            node scripts/pipeline/exec-summary.js
          fi

      # Step 2b: Build weekly brief on the Monday-only 05:45 UTC cron (covers Mon-Sun of prior week).
      # Dedicated cron `45 5 * * 1` so the weekly fires fast without dragging the daily
      # exec-summary 2nd pass off its 07:15 slot. The in-step day-of-week guard is now
      # redundant for the scheduled trigger but kept so workflow_dispatch behaves the
      # same way (only runs on Mondays unless dispatched manually on another day).
      - name: Build weekly brief
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not Monday (DOW=$(date -u +%u)) — skipping weekly brief"
            exit 0
          fi
          node scripts/pipeline/weekly-summary.js

      # Step 3: Rebuild news.json (pipeline does this, but run standalone as safety net).
      # Must precede the OG card render below — build-og-images.js reads the weekly
      # article (title → date range, "## " headers → category list) out of news.json,
      # and the brief written in step 2b only lands there on this rebuild.
      - name: Rebuild news.json
        run: node scripts/build-news.js

      # Step 3b: Render the weekly brief's OG card, so the /w/<date>/ link embed
      # shows the branded card the moment the post goes up. Was local-only until
      # 2026-08-03; the card was twice missing at post time (07-27, 08-03) because
      # rendering depended on someone remembering `npm run og-images` on a Monday.
      # Interview and Tesla-release cards stay local (they accompany a manual
      # content commit) — this run just fills whatever PNG is missing, which on a
      # Monday is the week's card.
      # continue-on-error like the render itself: a missing card degrades the
      # Reddit embed to the generic site card, it must never fail the pipeline
      # (which would open a pipeline-failure issue for a cosmetic asset).
      - name: Install Chromium for OG render
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 1'
        run: npx playwright install --with-deps chromium

      - name: Render OG cards
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 1'
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not Monday (DOW=$(date -u +%u)) — skipping OG card render"
            exit 0
          fi
          node scripts/build-og-images.js

      # Step 3c: Build the Reddit version of the weekly brief. Runs AFTER the card
      # render so its Variant A "OG card not in repo yet" reminder only appears when
      # the render actually failed (the step above is continue-on-error).
      # Same gating as the weekly brief (Monday 05:45 UTC OR workflow_dispatch).
      # Reformatter takes the latest news/*_weekly_brief_summary.txt as input.
      - name: Build Reddit weekly post
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not Monday (DOW=$(date -u +%u)) — skipping Reddit weekly post"
            exit 0
          fi
          node scripts/pipeline/reddit-weekly.js

      # Commit new summaries and updated state
      - name: Commit changes
        id: commit
        run: |
          git config user.name "TTT Pipeline Bot"
          git config user.email "pipeline@theteslathesis.com"
          git add news/ src/data/news.json scripts/pipeline/state.json scripts/pipeline/costs.json scripts/pipeline/extracted-facts.json data/reddit-weekly/ public/og/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new summaries to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily summaries: $(date -u +%Y-%m-%d)

          Summarize new transcripts via Claude Batch API, rebuild news.json"
            git pull --rebase
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Step 4: Build and deploy to GitHub Pages (GITHUB_TOKEN pushes don't trigger other workflows)
      - name: Build site
        if: steps.commit.outputs.has_changes == 'true'
        run: npm run build

      - name: Upload pages artifact
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Deploy in a separate job that shares the repo-wide "pages" concurrency group
  # with deploy-pages.yml, so the two never hit the Pages deployment API at the
  # same time (that cross-workflow race caused the "in progress deployment" 400s).
  # The artifact uploaded by the pipeline job above is run-scoped, so this job
  # only needs to call deploy-pages.
  deploy:
    needs: pipeline
    if: needs.pipeline.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # Same retry-once-after-backoff as deploy-pages.yml: the Pages API
      # intermittently fails deployments server-side and a rerun succeeds.
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 180
      - id: deployment_retry
        name: Retry deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # Create a GitHub issue on pipeline failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [pipeline, deploy]
    if: failure()
    steps:
      # Needed for the rolling-issue helper below.
      - uses: actions/checkout@v6

      # Log the failure into one rolling issue rather than opening a new one per
      # failing run (silent body edit — see scripts/rolling-issue.cjs). The most
      # recent 15 failures are kept so a repeating pattern is visible at a glance.
      - name: Log pipeline failure
        uses: actions/github-script@v9
        with:
          script: |
            const { upsertRollingIssue, rollingFooter } = require(`${process.env.GITHUB_WORKSPACE}/scripts/rolling-issue.cjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const entry = `- ${new Date().toISOString()} — [run ${context.runId}](${runUrl})`;

            const res = await upsertRollingIssue(github, context, {
              label: 'pipeline-failure',
              title: 'Daily pipeline: failure log',
              color: 'D93F0B',
              body: (existing) => {
                const prior = (existing.match(/^- \d{4}-\d{2}-\d{2}T.*$/gm) || []).slice(0, 14);
                const log = [entry, ...prior].join('\n');
                return `The daily summary pipeline failed. Most recent failures (newest first):\n\n${log}\n\n**Check:** workflow logs at the run link. A failure here can mean transcripts went unsummarized — \`freshness-check.yml\` tracks that separately.${rollingFooter()}`;
              },
            });
            console.log(`${res.created ? 'Created' : 'Updated'} failure log issue #${res.number}`);
